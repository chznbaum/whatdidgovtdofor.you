  # Partisan races: the County Clerk's results print DEM/REP. Three-year staggered terms, three seats each November.
  # Leon, Bodek and Delisfort (terms 2024-2026) were re-elected Nov. 3, 2026 (unofficial, all 434 districts), so no
  # member changes in January 2027; the board elects a new Chair and Vice Chair at its January reorganization.
  # No elected executive: the County Manager (Edward T. Oatman, since 2018) is appointed by the board.
