name: Hennepin County
short: Hennepin
kind: county
parent: mn
geoids: { state: "27", county: "27053" }
# The county's website forbids all robots; its Legistar records are on the shared Legistar API. Titles are terse
# abbreviations, so triage needs each resolution's text.
feeds:
  - { type: legistar, client: hennepinmn, types: [Resolution], text: true }
council:
  body: Board of Commissioners
  title: Commissioner
  districts: { arcgis: "https://enterprise.gisdata.mn.gov/aghost/rest/services/us_mn_state_sos/bdry_votingdistricts/FeatureServer/0", field: ctycomdist }
