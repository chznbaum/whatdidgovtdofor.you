  checked: 2026-11-13
  # County races are nonpartisan by law. Districts come from the Secretary of State's statewide precinct layer; the
  # county's own site and map server forbid all robots.
  members:
    - { district: "1", name: Jeff Lunde, party: NP }
    - { district: "2", name: Irene Fernando, party: NP }
    - { district: "3", name: Marion Greene, party: NP }
    - { district: "4", name: Angela Conley, party: NP }
    - { district: "5", name: Debbie Goettel, party: NP }
    - { district: "6", name: Heather Edelson, party: NP }
    - { district: "7", name: Kevin Anderson, party: NP }
