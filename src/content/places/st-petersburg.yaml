    - { district: "6", name: Gina Driscoll, party: NP, url: "https://www.stpete.org/government/mayor___city_council/city_council/district_6.php", until: 2027-01-07 }
    - { district: "6", name: Linsey Grove, party: NP, from: 2027-01-07 }
