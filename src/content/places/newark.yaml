name: Newark
short: Newark
kind: city
parent: essex-county
geoids: { state: "34", place: "3451000" }
# Legistar's sponsors are each council item's mover and seconder; the administration's items list "Council of the
# Whole", which the feed drops. The mayor's executive orders are filed in Legistar too. The city's website is behind a
# Cloudflare block, and its agenda PDFs are on a host whose robots.txt disallows everything; the API has what they do.
feeds:
  - { type: legistar, client: newark, types: [Ordinance, Resolution], sponsors: true, text: true }
  - { type: legistar, id: newark-mayor-orders, client: newark, types: [Executive Order], status: Filed, text: true }
council:
  body: Municipal Council
  title: Council Member
  # The city's own layer carries the 2012 ward plan. The 2022 redraw moved election districts, not (as far as any
  # record shows) the wards, which were within the law's 10% population spread: all 163 of the 2020 voting districts
  # and 149 of 158 Nov. 2026 polling places fall in their ward (the rest are buildings shared across the North/Central
  # line). The 2022 ward-commission report would settle it; newarknj.gov blocks our reader.
  districts: { arcgis: "https://services1.arcgis.com/WAUuvHqqP3le2PMh/arcgis/rest/services/Newark_Geographies/FeatureServer/1", field: WARD_NAME, label: Ward }
  url: "https://newark.legistar.com/People.aspx"
  checked: 2026-11-14
  # Elected in nonpartisan May municipal elections (Faulkner Act mayor-council, nonpartisan elections): the Essex County
  # Clerk's May 12, 2026 results print no party for any candidate. Terms run July 1, 2026 to June 30, 2030
  # (Legistar office records), so no seat changes in January 2027. Ward assignments are the clerk's contest names.
  members:
    - { district: North, name: "Anibal Ramos, Jr.", party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=5750&GUID=8164CA3C-2BA2-42C0-BD14-41E766746F00" }
    - { district: South, name: Patrick O. Council, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=137405&GUID=90D9A474-4D4F-4325-BF3F-DBB577B5837A" }
    - { district: East, name: Michael J. Silva, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=274876&GUID=029B186D-E2D6-472B-A733-CF27016F0E62" }
    - { district: West, name: Dupré L. Kelly, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=274864&GUID=13FC1249-59A4-4FC8-BAD4-2A305C3AA814" }
    - { district: Central, name: Amina Bey, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=137718&GUID=6364CE28-24CD-431F-87E0-33E508173ABC" }
    - { name: Luis A. Quintana, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=5749&GUID=FC8185B7-E99A-4DD0-AD07-252E52879F11" } # Council President
    - { name: C. Lawrence Crump, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=71051&GUID=6DB52DDB-D1BB-4CF3-AFF7-7C4F8429BFE8" }
    - { name: Louise Scott-Rountree, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=274875&GUID=BBC81EFD-2272-4F4F-B9DC-DB6E4DB1C7C0" }
    - { name: Donna Jackson, party: NP, url: "https://newark.legistar.com/PersonDetail.aspx?ID=343521&GUID=22A1EA16-EE41-412C-AB25-A2BFA038F1B0" }
