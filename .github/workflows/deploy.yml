# Builds the site and deploys it to Bunny (Storage Zone behind a Pull Zone) on every push to main,
# including the daily pipeline's pushes. The secrets live in the `production` environment, which only main may
# deploy to: BUNNY_STORAGE_ZONE, BUNNY_STORAGE_PASSWORD, BUNNY_STORAGE_HOST, BUNNY_API_KEY, BUNNY_PULLZONE_ID
# (see ops/deploy-bunny.mjs).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; a newer push waits rather than racing an upload in progress.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The npm that wrote package-lock.json. Other npm versions disagree about the optional wasm32 builds the
      # lock records but never installs (e.g. @rolldown/binding-wasm32-wasi), and `npm ci` then refuses the lock.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - name: Deploy to Bunny
        run: node ops/deploy-bunny.mjs
        env:
          BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
          BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          BUNNY_STORAGE_HOST: ${{ secrets.BUNNY_STORAGE_HOST }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
